<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウェルみくじ</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
      padding: 0 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    #description {
      font-size: 1.2em;
      color: #444;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    #result {
      font-size: 1.8em;
      margin: 20px;
    }

    #advice, #luckyItem, #luckyColor {
      font-size: 1.3em;
      color: #555;
      margin: 12px;
      line-height: 1.7;
    }

    /* 入力欄を大きくしてスマホで見やすく */
    input[type="text"] {
      width: 100%;
      font-size: 1.4em;
      padding: 16px 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      margin: 8px;
      padding: 14px 22px;
      font-size: 1.3em;
      cursor: pointer;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      body {
        font-size: 1.15em;
      }

      button {
        width: 100%;
        font-size: 1.35em;
      }

      #result {
        font-size: 1.6em;
      }

      input[type="text"] {
        font-size: 1.5em;
        padding: 18px 20px;
      }
    }
  </style>
</head>

<body>
  <h1>🎲 ウェルみくじ 🎲</h1>

  <div id="description">
    このおみくじは1日1回だけ引けます。<br>
    今日の運勢とアドバイスを楽しんでください！<br>
    このおみくじを引いてみての感想や改善点、さらに面白くできる案などコメント欄に書いてください。<br>
    送信したコメントが表示されるのは管理者ページだけです。
  </div>

  <button id="drawBtn">おみくじを引く</button>

  <div id="result"></div>
  <div id="advice"></div>
  <div id="luckyItem"></div>
  <div id="luckyColor"></div>

  <h2>💬 コメント送信</h2>
  <input type="text" id="commentInput" placeholder="コメントを入力">
  <button id="commentBtn">送信</button>

  <script>
    const fortunes = [
      { fortune: "大吉", advice: "今日は何もかもうまくいく気がする。今日を楽しもう！" },
      { fortune: "大吉", advice: "新しい挑戦が最高の結果をもたらす日。思い切って一歩踏み出してみよう" },
      { fortune: "大吉", advice: "これまでの努力が今花開こうとしてる。自分の頑張りを認めよう！" },
      { fortune: "中吉", advice: "周囲との協力を大切にすると運が上がるかも？積極的に人と話してみよう。" },
      { fortune: "中吉", advice: "深呼吸してみよう。深呼吸は安心感につながり、コミュニケーションを活性化させる！" },
      { fortune: "中吉", advice: "ゆっくり歩いてみよう。いつもと違うものが見えるかも。" },
      { fortune: "中吉", advice: "気になっていた場所に足を運んでみよう。新しい刺激が新たな視点を生み出す。" },
      { fortune: "中吉", advice: "今日の自分に何か「ありがとう」を１つ言ってあげよう。" },
      { fortune: "中吉", advice: "小さな挑戦が大きな自信につながるかも。気になっていたことに一歩踏み出してやってみよう！" },
      { fortune: "中吉", advice: "今日は自分のペースを大切にすると良い日。焦らずじっくり進もう。" },
      { fortune: "中吉", advice: "小さな感謝を言葉にしてみよう。人との距離がぐっと縮まるかも。" },
      { fortune: "中吉", advice: "自分の「好き」を誰かと共有してみよう。楽しい時間が広がる予感。" },
      { fortune: "中吉", advice: "今日は「余白」を大切にすると良い日。予定を詰めすぎず、ゆとりを持ってみよう。" },
      { fortune: "小吉", advice: "小さな幸せを思いっきり噛みしめよう！" },
      { fortune: "小吉", advice: "今日は小さなご褒美を自分にあげてみよう。心が軽くなる一日になる。" },
      { fortune: "小吉", advice: "誰かにちょっとした優しさを渡してみよう。巡り巡って自分にも返ってくるはず。" },
      { fortune: "小吉", advice: "新しい自分が見つかるかもしれない。いつもとは違う道を歩いてみよう。" },
      { fortune: "小吉", advice: "頑張りすぎる必要なし！自分の好きを全力でやってみよう。" },
      { fortune: "小吉", advice: "肩の力を抜いてみよう。余分な力が抜けパフォーマンスの向上につながる！" },
      { fortune: "小吉", advice: "空を見上げてみよう。気持ちがふっと軽くなる瞬間があるかも。" },
      { fortune: "小吉", advice: "お気に入りの飲み物でひと息ついてみよう。心がふわっとほぐれるはず。" },
      { fortune: "小吉", advice: "今日は「聞く力」が幸運を呼ぶ日。相手の話にじっくり耳を傾けてみよう。" },
      { fortune: "小吉", advice: "ひとつのことに丁寧に向き合うと運が味方してくれる日。焦らず取り組んでみよう。" },
      { fortune: "吉", advice: "焦らず一歩ずつ進めば成果につながる！" },
      { fortune: "吉", advice: "今日は直感が冴える日。ピンときたことを信じて動いてみよう！" },
      { fortune: "吉", advice: "気になっていた本や音楽に触れてみよう。心が豊かになる時間になるはず。" },
      { fortune: "吉", advice: "今日は「ちょっとした工夫」が運を引き寄せる日。いつもと違うやり方を試してみよう！" },
      { fortune: "吉", advice: "ありのままの自分を思いっきり出してみよう。新たな出会いがあるかも。" },
      { fortune: "吉", advice: "自分の悩みを誰かに相談してみよう。思わぬ解決法が見つかるかも？" },
      { fortune: "吉", advice: "身の回りを少し整えてみよう。気持ちもすっきりして、心や頭の整理にもなる。" },
      { fortune: "吉", advice: "誰かに「ありがとう」を伝えてみよう。心があたたまる日になるかも。" },
      { fortune: "吉", advice: "今日は思いがけない嬉しい知らせが届く予感。心を開いて受け取ってみよう！" },
      { fortune: "吉", advice: "過去の自分を振り返るとヒントが見つかるかも。写真や日記を見返してみよう。" },
      { fortune: "凶", advice: "無理をせず休むことが大切。慎重に過そう。" },
      { fortune: "凶", advice: "自分が気づいていない心の疲れがあるかも。今日は無理せず早めに寝て頭と体を休ませてあげよう。" },
      { fortune: "凶", advice: "思わぬ形でミスしちゃうかも。今日はいつもと違うところでお昼を食べてリフレッシュしよう。" },
      { fortune: "凶", advice: "１回立ち止まって周りの景色を見てみよう。" }
    ];

    const luckyItems = [
      "ボールペン","あったかい飲み物","青い小物","ハンカチ",
      "スマホスタンド","お気に入りのアクセサリー","メモ帳",
      "イヤホン","腕時計","ポケットティッシュ","クリップ",
      "緑茶","ヨーグルト","ハンドクリーム"
    ];

    const luckyColors = ["赤","青","黄色","緑","白","黒","ピンク","紫","オレンジ","水色"];

    const resultDiv = document.getElementById("result");
    const adviceDiv = document.getElementById("advice");
    const luckyItemDiv = document.getElementById("luckyItem");
    const luckyColorDiv = document.getElementById("luckyColor");
    const drawBtn = document.getElementById("drawBtn");

    function getToday() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
    }

    drawBtn.addEventListener("click", () => {
      const today = getToday();
      const lastDraw = localStorage.getItem("lastDrawDate");

      if (lastDraw === today) {
        resultDiv.textContent = "今日はもう引いたよ！";
        adviceDiv.textContent = "";
        luckyItemDiv.textContent = "";
        luckyColorDiv.textContent = "";
      } else {
        const choice = fortunes[Math.floor(Math.random() * fortunes.length)];
        const item = luckyItems[Math.floor(Math.random() * luckyItems.length)];
        const color = luckyColors[Math.floor(Math.random() * luckyColors.length)];

        resultDiv.textContent = "あなたの運勢は…「" + choice.fortune + "」です！";
        adviceDiv.textContent = "💡 アドバイス: " + choice.advice;
        luckyItemDiv.textContent = "🎁 ラッキーアイテム: " + item;
        luckyColorDiv.textContent = "🎨 ラッキーカラー: " + color;

        localStorage.setItem("lastDrawDate", today);
      }
    });

    const commentInput = document.getElementById("commentInput");
    const commentBtn = document.getElementById("commentBtn");

    commentBtn.addEventListener("click", () => {
      const text = commentInput.value.trim();
      if (text) {
        fetch("/comment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        }).then(res => {
          if (res.ok) {
            alert("コメントが送信されました！");
            commentInput.value = "";
          } else {
            alert("送信に失敗しました");
          }
        });
      }
    });
  </script>
</body>
</html>
